<div class="card p-3 md:p-6">
    <!-- HEADER + ACTION BUTTONS -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
        <span class="block text-surface-900 font-bold text-lg md:text-xl">Work Listing</span>
        <div class="flex flex-wrap gap-2 md:gap-4 w-full md:w-auto">
            <button pButton type="button" label="Add"
                class="p-button-warning w-full md:w-auto"
                (click)="add()">
            </button>
            <button pButton type="button" label="Submit"
                class="p-button-warning w-full md:w-auto"
                (click)="onSubmit()"
                [disabled]="workList.length === 0">
            </button>
            <button pButton type="button" label="Reset"
                class="p-button-secondary w-full md:w-auto"
                (click)="onReset()">
            </button>
        </div>
    </div>

     <!-- Global Search -->
    <div class="mb-6 w-full" *ngIf="showGlobalSearch">
        <app-global-filter
            [(value)]="globalFilter"
            placeholder="Search..."
            (valueChange)="applyGlobalFilter()"
        ></app-global-filter>
    </div>

    <form [formGroup]="salesForm">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-x-4 gap-y-3 mb-6">

            <!-- Project -->
            <div class="flex flex-col">
                <label class="font-medium mb-1">Project <span class="text-red-500">*</span></label>
                <p-dropdown
                    [options]="projectOptions"
                    optionLabel="label"
                    optionValue="value"
                    placeholder="Select Project"
                    formControlName="p_project"
                    [filter]="true"
                    [showClear]="true"
                    [ngClass]="{'ng-invalid ng-dirty': salesForm.get('p_project')?.touched && salesForm.get('p_project')?.invalid}"
                ></p-dropdown>
                <small class="text-red-500 text-xs mt-1"
                    *ngIf="salesForm.get('p_project')?.touched && salesForm.get('p_project')?.errors?.['required']">
                    Project is required
                </small>
            </div>

            <!-- Tower -->
            <div class="flex flex-col">
                <label class="font-medium mb-1">Tower / Block <span class="text-red-500">*</span></label>
                <p-dropdown
                    [options]="towerOptions"
                    optionLabel="label"
                    optionValue="value"
                    placeholder="Select Tower/Block"
                    formControlName="p_tower"
                    [filter]="true"
                    [showClear]="true"
                    [ngClass]="{'ng-invalid ng-dirty': salesForm.get('p_tower')?.touched && salesForm.get('p_tower')?.invalid}"
                ></p-dropdown>
                <small class="text-red-500 text-xs"
                    *ngIf="salesForm.get('p_tower')?.touched && salesForm.get('p_tower')?.errors?.['required']">
                    Tower is required
                </small>
            </div>

            <!-- Level -->
              <div class="flex flex-col">
                <label class="font-medium mb-1">Level</label>
                <input pInputText formControlName="p_level" placeholder="Level" />
            </div>

             <!-- Pour -->
              <div class="flex flex-col">
                <label class="font-medium mb-1">Pour</label>
                <input pInputText  formControlName="p_pour" placeholder="Pour" />
            </div>
        </div>
    </form>

    <!-- TABLE -->
    <p-table
        [value]="filterWorkList"
        [responsiveLayout]="'scroll'"
        [paginator]="true"
        [rows]="10"
        [rowsPerPageOptions]="[10, 20, 50]"
        class="p-datatable-gridlines p-datatable-sm"
    >
        <ng-template pTemplate="header">
            <tr class="bg-yellow-400">
                <!-- Select All checkbox in header -->
                <th class="text-center" style="width: 3rem">
                    <p-checkbox
                        [binary]="true"
                        [ngModel]="allCompleted"
                        [ngModelOptions]="{standalone: true}"
                        (onChange)="toggleAll($event.checked)"
                        [indeterminate]="someCompleted && !allCompleted"
                    ></p-checkbox>
                </th>
                <th>Project</th>
                <th>Tower / Block</th>
                <th>Level</th>
                <th>Pour</th>
                <th class="text-center">Action</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row let-i="rowIndex">
            <!-- VIEW MODE -->
            <tr *ngIf="editingIndex !== i">
                <td class="text-center">
                    <p-checkbox
                        [(ngModel)]="row.completed"
                        [binary]="true"
                        [ngModelOptions]="{standalone: true}"
                        (onChange)="onCompletedChange(i)"
                    ></p-checkbox>
                </td>
                <td>{{ row.project }}</td>
                <td>{{ row.tower }}</td>
                <td>{{ row.level }}</td>
                <td>{{ row.pour }}</td>
                <td class="text-center">
                    <button pButton type="button" icon="pi pi-pencil"
                        class="p-button-text p-button-info p-button-sm mr-1"
                        pTooltip="Edit" tooltipPosition="top"
                        (click)="startEdit(i)">
                    </button>
                    <button pButton type="button" icon="pi pi-trash"
                        class="p-button-text p-button-danger p-button-sm"
                        pTooltip="Delete" tooltipPosition="top"
                        (click)="removeItem(i)">
                    </button>
                </td>
            </tr>

            <!-- EDIT MODE -->
            <tr *ngIf="editingIndex === i" [formGroup]="editForm">
                <td class="text-center">
                    <p-checkbox
                        [(ngModel)]="row.completed"
                        [binary]="true"
                        [ngModelOptions]="{standalone: true}"
                    ></p-checkbox>
                </td>
                <td>
                    <p-dropdown [options]="projectOptions" optionLabel="label" optionValue="value"
                        formControlName="p_project" [showClear]="true" [style]="{'width':'100%'}">
                    </p-dropdown>
                </td>
                <td>
                    <p-dropdown [options]="towerOptions" optionLabel="label" optionValue="value"
                        formControlName="p_tower" [showClear]="true" [style]="{'width':'100%'}">
                    </p-dropdown>
                </td>
                <td>
                    <input pInputText formControlName="p_level" placeholder="Level" />
                </td>
                <td>
                     <input pInputText formControlName="p_pour" placeholder="Pour" />
                </td>
                <td class="text-center">
                    <button pButton type="button" icon="pi pi-check"
                        class="p-button-text p-button-success p-button-sm mr-1"
                        pTooltip="Save" tooltipPosition="top"
                        (click)="saveEdit(i)">
                    </button>
                    <button pButton type="button" icon="pi pi-times"
                        class="p-button-text p-button-secondary p-button-sm"
                        pTooltip="Cancel" tooltipPosition="top"
                        (click)="cancelEdit()">
                    </button>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="6" class="text-center text-400 italic py-6 text-sm">
                    No rows added — fill the fields above and click Add.
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="paginatorleft">
            <div class="text-500 text-xs ms-2">Total Items: {{ filterWorkList.length }}</div>
        </ng-template>
    </p-table>

    <p-confirmDialog></p-confirmDialog>
</div>
