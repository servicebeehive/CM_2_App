<div class="card p-6">
    <!-- Header Row: Stock In + Buttons -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
        <span class="block text-surface-900 font-bold text-2xl">My Approval</span>

        <!-- Buttons - Hidden on mobile, shown in header on desktop -->
        <div class="hidden md:flex gap-4">
            <button pButton type="button" label="Display" class="p-button-warning" (click)="display()"></button>
            <button pButton type="button" label="Download" icon="pi pi-download" iconPos="right" class="p-button-warning" (click)="onDownloadClick()"></button>
            <button pButton type="button" label="Reset" class="p-button-secondary" (click)="reset()"></button>
        </div>
    </div>

    <form [formGroup]="customerForm" class="space-y-8">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-x-8 gap-y-4 w-full">
            <!-- Request -->
            <div class="flex flex-col">
                <label class="font-medium mb-1">Request</label>
                <p-dropdown [options]="requestOptions" optionValue="fieldid" optionLabel="fieldname" [filter]="true" [showClear]="true" filterPlaceholder="Search Request" formControlName="p_request" placeholder="Request" class="w-full"> </p-dropdown>
            </div>

            <!-- Type -->
            <div class="flex flex-col">
                <label class="font-medium mb-1">Type</label>
                <p-dropdown [options]="typeOptions" optionValue="rule_name" optionLabel="rule_name" [filter]="true" [showClear]="true" filterPlaceholder="Search Type" formControlName="p_type" placeholder="Type" class="w-full"> </p-dropdown>
            </div>
        </div>

        <!-- Action Buttons - Visible only on mobile, below form fields -->
        <div class="flex md:hidden justify-center gap-2 mt-6">
            <button pButton type="button" label="Display" class="p-button-warning flex-1" (click)="display()" [disabled]="customerForm.invalid"></button>
            <button pButton type="button" label="Download" class="p-button-warning flex-1" (click)="onDownloadClick()"></button>
            <button pButton type="button" label="Reset" class="p-button-secondary flex-1" (click)="reset()"></button>
        </div>

        <!-- Product Table with Pagination -->
        <div>
            <p-table [value]="filteredProducts" [tableStyle]="{ 'min-width': '50rem' }" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 20, 50]" [responsiveLayout]="'scroll'" class="p-datatable-gridlines mt-6 my-approval">
                <ng-template pTemplate="header">
                    <tr class="bg-yellow-400">
                        <th>Location</th>
                        <th>Period</th>
                        <th>PO No</th>
                        <th>MF No</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-row let-i="rowIndex">
                    <tr>
                        <td>{{ row.request_id }}</td>
                        <td>{{ row.invoice_no }}</td>
                        <td class="text-xs md:text-sm">
    <div class="flex items-center justify-between gap-2">
        {{ row.invoice_no }}
        <i 
            class="pi pi-eye text-primary cursor-pointe"
            (click)="onViewPO(row.get('p_requisitionno')?.value)"
            pTooltip="View PO"
            tooltipPosition="top"
        ></i>
    </div>
</td>
                      <td class="text-xs md:text-sm">
    <div class="flex items-center justify-between gap-2">
        {{ row.request_type }}
        <i 
            class="pi pi-eye text-primary cursor-pointer"
            (click)="onViewMF(row.get('p_mfno')?.value)"
            pTooltip="View MF"
            tooltipPosition="top"
        ></i>
    </div>
</td>
                        <td>{{ row.amount }}</td>
                        <td>{{ row.status }}</td>
                        <td class="text-center w-[60px]">
                            <div class="flex g-2">
                                <button pButton type="button" icon="pi pi-check-square" class="p-button-text p-button-sm p-button-success" (click)="approved(row)" [disabled]="row.status !== 'PENDING'"></button>
                                <button pButton type="button" icon="pi pi-ban" class="p-button-text p-button-sm p-button-danger" (click)="reject(row)" [disabled]="row.status !== 'PENDING'"></button>
                                 <ng-container *ngIf="row.request_type === 'Write-off'">
                                <!-- <button pButton type="button" icon="pi pi-eye" class="p-button-text p-button-sm p-button-info" (click)="view(row)"></button> -->
                                </ng-container>
                            </div>
                        </td>
                    </tr>
                </ng-template>

                <ng-template pTemplate="paginatorleft" appendTo="body">
                    <div class="total-items text-gray-600 ms-2">Total Items: {{ filteredProducts?.length || 0 }}</div>
                </ng-template>
            </p-table>
        </div>
    </form>
    
    <p-dialog header="Reject Approval" [(visible)]="rejectiondetails" [modal]="true" [style]="{ width: '600px' }" [closable]="true">
        <div class="p-fluid">
            <label class="mb-2 block"> Please provide a reason for rejection: </label>

            <div class="mb-3">
                <label for="comment"><b>Comment *</b></label>
                <textarea id="comment" pInputTextarea [(ngModel)]="rejectComment" [ngModelOptions]="{ standalone: true }" rows="4" class="w-full" [ngClass]="{ 'ng-invalid ng-dirty': submitted && !rejectComment }"> </textarea>
            </div>

            <!-- Error Message -->
            <p-message *ngIf="submitted && !rejectComment" severity="error" text="Comment is required for rejection."> </p-message>
        </div>

        <!-- Footer -->
        <ng-template pTemplate="footer">
            <button pButton label="Cancel" class="p-button-secondary" (click)="rejectiondetails = false"></button>

            <button pButton label="Submit" class="p-button-danger" (click)="submitReject()" [disabled]="!rejectComment || rejectComment.trim().length === 0"></button>
        </ng-template>
    </p-dialog>
    <p-confirmDialog></p-confirmDialog>
</div>
