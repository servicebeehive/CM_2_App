<div class="card p-3 md:p-6">
    <!-- Header: title + New Transfer button aligned top-right -->
    <div class="flex justify-between items-center mb-6">
        <span class="block text-surface-900 font-bold text-2xl">{{ pageTitle }}</span>
        <button pButton type="button" [label]="newButtonLabel" icon="pi pi-plus"
                class="p-button-warning" (click)="newTransfer()"></button>
    </div>

    <!-- ================================
         TRANSFER LIST TABLE
    ================================= -->
    <p-table #dt [value]="transferList" [responsiveLayout]="'scroll'" [paginator]="true" [rows]="10"
             [rowsPerPageOptions]="[10, 20, 50]" class="p-datatable-gridlines p-datatable-sm mb-6 material-transfer">

        <ng-template pTemplate="header">
            <!-- Search row — sits above the column titles, outside each column -->
            <tr class="mr-filter-row">
        <th *ngFor="let column of columns; let i = index; trackBy: trackByField">
         <input #filterInput pInputText type="text" placeholder="Search" class="w-full"
             (input)="dt.filter($any($event.target).value, column.field, 'contains')" />
        </th>
    <th class="text-center">
        <button pButton type="button" label="Reset" icon="pi pi-refresh"
                class="p-button-sm mr-reset-btn w-full"
              (click)="resetTable(dt)">
        </button>
    </th>
</tr>

            <!-- Column titles + sort icons -->
            <tr class="bg-yellow-400">
                <th *ngFor="let column of columns; trackBy: trackByField" [pSortableColumn]="column.field">
                    {{ column.header }} <p-sortIcon [field]="column.field"></p-sortIcon>
                </th>
                <th class="text-center">Action</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-row>
            <tr>
                <td *ngFor="let column of columns; let i = index; trackBy: trackByField" class="text-sm" [class.font-bold]="i === 0">
                    <span *ngIf="column.field === 'status'; else plainValue" class="px-3 py-1 rounded-full text-xs font-semibold" [ngClass]="statusClass(value(row, column))">{{ value(row, column) }}</span>
                    <ng-template #plainValue>{{ isDateField(column.field) && value(row, column) !== '-' ? (value(row, column) | date: 'dd-MM-yyyy') : value(row, column) }}</ng-template>
                </td>
                <td class="text-center">
                    <div class="mr-action-group">
                        <button pButton type="button" icon="pi pi-eye" pTooltip="View"
                                class="p-button-text p-button-sm" (click)="onViewTransfer(row)"></button>
                        
                        <button *ngIf="transactionType === 'transfer'" pButton type="button" icon="pi pi-trash" pTooltip="Delete"
                                class="p-button-text p-button-sm p-button-danger" (click)="onDeleteTransfer(row)"></button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <tr>
                <td [attr.colspan]="columns.length + 1" class="text-center text-400 italic py-6 text-sm">No records found</td>
            </tr>
        </ng-template>
        <ng-template pTemplate="paginatorleft">
            <div class="text-500 text-xs ms-2">Total Items: {{ transferList.length }}</div>
        </ng-template>
    </p-table>

    <p-confirmDialog></p-confirmDialog>

</div>
